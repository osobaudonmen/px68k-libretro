name: Build Distribution Release

on:
  push:
    branches: [ custom ]

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    # Linuxビルド
    - name: Build Linux x64 core
      run: |
        make -j$(getconf _NPROCESSORS_ONLN) C68K=1
        mkdir -p dist/linux-x64
        cp px68k_libretro.so dist/linux-x64/
        cp README.MD dist/linux-x64/
        cp COPYING dist/linux-x64/
        cd dist
        zip -r px68k-libretro-linux-x64.zip linux-x64/
    
    # Windowsビルド（mingw-w64を使用）
    - name: Install mingw-w64
      run: sudo apt update && sudo apt install -y mingw-w64
    - name: Build Windows x64 core
      run: |
        make -j8 C68K=1 platform=wincross64
        mkdir -p dist/windows-x64
        cp px68k_libretro.dll dist/windows-x64/
        cp README.MD dist/windows-x64/
        cp COPYING dist/windows-x64/
        cd dist
        zip -r px68k-libretro-windows-x64.zip windows-x64/
    
    # Androidビルド
    - name: Setup Android NDK
      uses: nttld/setup-ndk@v1
      with:
        ndk-version: r21e
    - name: Build Android cores
      run: |
        cd libretro/jni
        $ANDROID_NDK_HOME/ndk-build APP_ABI="armeabi-v7a arm64-v8a x86 x86_64" -j$(getconf _NPROCESSORS_ONLN)
        cd ../..
        
        # Create separate directories for each ABI
        mkdir -p dist/android-armeabi-v7a
        mkdir -p dist/android-arm64-v8a
        mkdir -p dist/android-x86
        mkdir -p dist/android-x86_64
        
        # Copy files with unified names
        cp libretro/libs/armeabi-v7a/libretro.so dist/android-armeabi-v7a/px68k_libretro.so
        cp README.MD dist/android-armeabi-v7a/
        cp COPYING dist/android-armeabi-v7a/
        
        cp libretro/libs/arm64-v8a/libretro.so dist/android-arm64-v8a/px68k_libretro.so
        cp README.MD dist/android-arm64-v8a/
        cp COPYING dist/android-arm64-v8a/
        
        cp libretro/libs/x86/libretro.so dist/android-x86/px68k_libretro.so
        cp README.MD dist/android-x86/
        cp COPYING dist/android-x86/
        
        cp libretro/libs/x86_64/libretro.so dist/android-x86_64/px68k_libretro.so
        cp README.MD dist/android-x86_64/
        cp COPYING dist/android-x86_64/
        
        cd dist
        zip -r px68k-libretro-android-armeabi-v7a.zip android-armeabi-v7a/
        zip -r px68k-libretro-android-arm64-v8a.zip android-arm64-v8a/
        zip -r px68k-libretro-android-x86.zip android-x86/
        zip -r px68k-libretro-android-x86_64.zip android-x86_64/
    
    - name: Create release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: custom-build-${{ github.sha }}
        name: PX68K Libretro Core - Custom Build ${{ github.sha }}
        body: |
          Precompiled PX68K libretro cores for distribution
          
          Built from commit: ${{ github.sha }}
          Branch: custom
          
          **Included platforms:**
          - Linux x64
          - Windows x64  
          - Android armeabi-v7a
          - Android arm64-v8a
          - Android x86
          - Android x86_64
        files: |
          dist/px68k-libretro-linux-x64.zip
          dist/px68k-libretro-windows-x64.zip
          dist/px68k-libretro-android-armeabi-v7a.zip
          dist/px68k-libretro-android-arm64-v8a.zip
          dist/px68k-libretro-android-x86.zip
          dist/px68k-libretro-android-x86_64.zip
        draft: false
        prerelease: true
    
    - name: Delete old releases
      run: |
        # 最新のリリース以外を削除（タグも一緒に削除される）
        gh release list --limit 100 | grep -v "custom-build-${{ github.sha }}" | awk '{print $1}' | xargs -I {} gh release delete {} --yes