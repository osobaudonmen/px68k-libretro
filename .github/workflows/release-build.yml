name: Build Distribution Release

on:
  push:
    branches: [ custom ]

jobs:
  build-linux-distribution:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Build Linux x64 core
      run: |
        make -j$(getconf _NPROCESSORS_ONLN) C68K=1
        mkdir -p dist/linux-x64
        cp px68k_libretro.so dist/linux-x64/
        cp README.MD dist/linux-x64/
        cp COPYING dist/linux-x64/
    - name: Archive Linux build
      run: |
        cd dist
        zip -r px68k-libretro-linux-x64.zip linux-x64/
    - name: Upload Linux artifact
      uses: actions/upload-artifact@v4
      with:
        name: px68k-libretro-linux-x64
        path: dist/px68k-libretro-linux-x64.zip

  build-windows-distribution:
    runs-on: windows-latest
    steps:
    - uses: msys2/setup-msys2@v2
      with:
        update: true
        install: >-
          base-devel
          gcc
          git
          make
          zip
          mingw-w64-x86_64-toolchain
          mingw-w64-x86_64-ntldd
          mingw-w64-x86_64-zlib
          mingw-w64-x86_64-pkg-config
    - uses: actions/checkout@v4
    - name: Build Windows x64 core
      shell: msys2 {0}
      run: |
        make -j8 C68K=1
        mkdir -p dist/windows-x64
        cp px68k_libretro.dll dist/windows-x64/
        cp README.MD dist/windows-x64/
        cp COPYING dist/windows-x64/
    - name: Archive Windows build
      shell: msys2 {0}
      run: |
        cd dist
        zip -r px68k-libretro-windows-x64.zip windows-x64/
    - name: Upload Windows artifact
      uses: actions/upload-artifact@v4
      with:
        name: px68k-libretro-windows-x64
        path: dist/px68k-libretro-windows-x64.zip

  build-android-distribution:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup Android NDK
      uses: nttld/setup-ndk@v1
      with:
        ndk-version: r21e
    - name: Build Android cores
      run: |
        cd libretro/jni
        $ANDROID_NDK_HOME/ndk-build APP_ABI="armeabi-v7a arm64-v8a x86 x86_64" -j$(getconf _NPROCESSORS_ONLN)
        cd ../..
        
        # Create separate directories for each ABI
        mkdir -p dist/android-armeabi-v7a
        mkdir -p dist/android-arm64-v8a
        mkdir -p dist/android-x86
        mkdir -p dist/android-x86_64
        
        # Copy files with unified names
        cp libretro/libs/armeabi-v7a/libretro.so dist/android-armeabi-v7a/px68k_libretro.so
        cp README.MD dist/android-armeabi-v7a/
        cp COPYING dist/android-armeabi-v7a/
        
        cp libretro/libs/arm64-v8a/libretro.so dist/android-arm64-v8a/px68k_libretro.so
        cp README.MD dist/android-arm64-v8a/
        cp COPYING dist/android-arm64-v8a/
        
        cp libretro/libs/x86/libretro.so dist/android-x86/px68k_libretro.so
        cp README.MD dist/android-x86/
        cp COPYING dist/android-x86/
        
        cp libretro/libs/x86_64/libretro.so dist/android-x86_64/px68k_libretro.so
        cp README.MD dist/android-x86_64/
        cp COPYING dist/android-x86_64/
    
    - name: Archive Android builds
      run: |
        cd dist
        zip -r px68k-libretro-android-armeabi-v7a.zip android-armeabi-v7a/
        zip -r px68k-libretro-android-arm64-v8a.zip android-arm64-v8a/
        zip -r px68k-libretro-android-x86.zip android-x86/
        zip -r px68k-libretro-android-x86_64.zip android-x86_64/
    
    - name: Upload Android artifacts
      uses: actions/upload-artifact@v4
      with:
        name: px68k-libretro-android-armeabi-v7a
        path: dist/px68k-libretro-android-armeabi-v7a.zip
    
    - name: Upload Android arm64-v8a artifact
      uses: actions/upload-artifact@v4
      with:
        name: px68k-libretro-android-arm64-v8a
        path: dist/px68k-libretro-android-arm64-v8a.zip
    
    - name: Upload Android x86 artifact
      uses: actions/upload-artifact@v4
      with:
        name: px68k-libretro-android-x86
        path: dist/px68k-libretro-android-x86.zip
    
    - name: Upload Android x86_64 artifact
      uses: actions/upload-artifact@v4
      with:
        name: px68k-libretro-android-x86_64
        path: dist/px68k-libretro-android-x86_64.zip

  create-release:
    runs-on: ubuntu-latest
    needs: [build-linux-distribution, build-windows-distribution, build-android-distribution]
    steps:
    - uses: actions/checkout@v4
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: dist/
    - name: Create release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: custom-build-${{ github.sha }}
        name: PX68K Libretro Core - Custom Build ${{ github.sha }}
        body: |
          Precompiled PX68K libretro cores for distribution
          
          Built from commit: ${{ github.sha }}
          Branch: custom
          
          **Included platforms:**
          - Linux x64
          - Windows x64  
          - Android armeabi-v7a
          - Android arm64-v8a
          - Android x86
          - Android x86_64
        files: |
          dist/px68k-libretro-linux-x64/px68k-libretro-linux-x64.zip
          dist/px68k-libretro-windows-x64/px68k-libretro-windows-x64.zip
          dist/px68k-libretro-android-armeabi-v7a/px68k-libretro-android-armeabi-v7a.zip
          dist/px68k-libretro-android-arm64-v8a/px68k-libretro-android-arm64-v8a.zip
          dist/px68k-libretro-android-x86/px68k-libretro-android-x86.zip
          dist/px68k-libretro-android-x86_64/px68k-libretro-android-x86_64.zip
        draft: false
        prerelease: true